site_name: pydantic-gepa
site_description: Typed, replayable GEPA optimization for Pydantic applications.
theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Common API: common-api.md
  - Evaluation: evaluation.md
  - Candidates and concurrency: candidates-concurrency.md
  - Multimodal evidence: multimodal.md
  - Plans and stages: plans.md
  - Checkpoint and resume: state.md
  - Events and observability: observability.md
  - CLI: cli.md
  - Typed configuration: configuration.md
  - Advanced adapters: advanced-adapters.md
  - Autobench bridge: autobench.md
  - Autoptimize contract: autoptimize.md
  - Migration: migration.md
  - API stability: api-stability.md
  - Changelog: changelog.md
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
strict: true
